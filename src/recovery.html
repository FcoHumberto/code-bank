<html>
    <head>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="./css.css">
        <title>Code Bank</title>
    </head>
    <body>
        <form>
            <input 
                type="email" 
                placeholder="Digite seu email" 
                id="email"
            />

            <br><br>

            <input 
                type="password" 
                placeholder="Digite a nova senha" 
                id="novasenha"
            />
            
            <br><br>

            <input 
                type="password" 
                placeholder="Confirme a nova senha" 
                id="confirmacao"
            />
            
            <br><br>

            <button id="redefinir">Redefinir senha</button>

            <br><br><br>

            <button id="voltar">Voltar</button>
        </form>
        <a href="./register.html">Não possui uma conta? Cadastre-se aqui.</a>
    </body>
    <script src="./recovery.js"></script>
</html>
